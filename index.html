<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toca Madera NFC</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #f1f1f1;
      text-align: center;
    }
    .box {
      max-width: 320px;
      padding: 24px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #1e1e1e;
    }
    h1 { font-size: 1.2rem; margin-bottom: 8px; }
    p { font-size: 0.95rem; color: #aaa; margin: 0; }
  </style>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!id) {
      window.addEventListener("DOMContentLoaded", () => {
        document.getElementById("msg").innerText = "ID de soporte no especificado.";
        document.getElementById("box").style.display = "block";
      });
    } else {
      fetch("./links.json?v=" + Date.now()) // anti-caché para actualizaciones instantáneas
        .then(res => res.json())
        .then(data => {
          const target = data[id];
          if (target && target.trim() !== "") {
            window.location.replace(target);
          } else {
            document.getElementById("msg").innerText = `Soporte #${id} disponible para activación.`;
            document.getElementById("box").style.display = "block";
          }
        })
        .catch(() => {
          document.getElementById("msg").innerText = "Error de conexión con el soporte.";
          document.getElementById("box").style.display = "block";
        });
    }
  </script>
</head>
<body>
  <div class="box" id="box" style="display: none;">
    <h1>Toca Madera NFC</h1>
    <p id="msg"></p>
  </div>
</body>
</html>
